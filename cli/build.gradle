apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    compileSdkVersion 34

    defaultConfig {
        applicationId "com.htetznaing.adbotg.cli"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 8
        versionName "3.7"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    sourceSets {
        // the Termux client script is the single source of truth, shipped as an asset
        main.assets.srcDirs += ['../termux']
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    namespace 'com.htetznaing.adbotg.cli'
}

dependencies {
    implementation project(':adblib')
    testImplementation 'junit:junit:4.13.2'
}
