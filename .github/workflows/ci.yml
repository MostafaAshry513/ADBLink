name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (platform 34)
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests
        id: tests
        continue-on-error: true
        run: ./gradlew :cli:testDebugUnitTest --console=plain

      # garbageBytesCloseSessionWithHexEvidence is timing-sensitive and has failed once on a
      # slow single-core machine. We re-run the suite ONCE on failure and print a warning.
      # A real failure fails both runs, so the job still goes red.
      - name: Retry unit tests once (known timing-sensitive test)
        if: steps.tests.outcome == 'failure'
        run: |
          echo "::warning::Unit tests failed on first run, retrying once (timing-sensitive test)."
          ./gradlew :cli:testDebugUnitTest --rerun-tasks --console=plain

      - name: Build debug APK
        run: ./gradlew :cli:assembleDebug --console=plain

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: cli/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ADBLink-debug-apk
          path: cli/build/outputs/apk/debug/*.apk
          if-no-files-found: error
