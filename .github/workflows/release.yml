name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (platform 34)
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Same one-retry policy as ci.yml for the known timing-sensitive test.
      - name: Unit tests (one retry allowed)
        run: |
          ./gradlew :cli:testDebugUnitTest --console=plain || {
            echo "::warning::Unit tests failed on first run, retrying once (timing-sensitive test)."
            ./gradlew :cli:testDebugUnitTest --rerun-tasks --console=plain
          }

      - name: Build debug APK
        run: ./gradlew :cli:assembleDebug --console=plain

      - name: Name the APK
        run: cp cli/build/outputs/apk/debug/*.apk "ADBLink-${GITHUB_REF_NAME}-debug.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ADBLink-*-debug.apk
          generate_release_notes: true
          body: |
            Debug-signed APK. It is not signed with a release key.
